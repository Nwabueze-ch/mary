<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Esther ❤️ My Valentine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: pink;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin-top: 30px;
      color: #d6006d;
      font-size: 2.5em;
    }

    p {
      font-size: 1.2em;
      color: #800040;
      margin: 10px 20px;
    }

    .teddy {
      font-size: 120px;
      margin-top: 20px;
      position: relative;
      z-index: 2;
    }

    .buttons {
      margin-top: 30px;
      position: relative;
      z-index: 2;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
      background: #ff4da6;
      color: white;
    }

    .message {
      margin-top: 30px;
      font-size: 1.2em;
      color: #d6006d;
      display: none;
      position: relative;
      z-index: 2;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      color: #ff69b4;
      font-size: 24px;
      animation: floatUp 4s linear infinite;
      opacity: 0.8;
      user-select: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.8;
      }
      50% {
        transform: translateY(-150px) scale(1.2);
        opacity: 1;
      }
      100% {
        transform: translateY(-300px) scale(1);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <h1>Esther ❤️</h1>

  <p>Thank you for always being such a lovely friend. You make life brighter and funnier 💕</p>

  <!-- 🧸 Teddy -->
  <div class="teddy">🧸</div>

  <!-- 💖 YES Buttons -->
  <div class="buttons">
    <button onclick="sayYes()">Yes 💖</button>
    <button onclick="sayYes()">Yes 😍</button>
  </div>

  <!-- 💌 Appreciation Message -->
  <div class="message" id="loveMessage">
    Yay! 🥰 You’re the best, Esther! Thanks for being amazing 💕
  </div>

  <script>
    // Show message when YES is clicked
    function sayYes() {
      document.getElementById("loveMessage").style.display = "block";
    }

    // Generate floating hearts
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.fontSize = (12 + Math.random() * 24) + 'px';
      heart.innerHTML = '💖';
      document.body.appendChild(heart);

      // Remove heart after animation
      setTimeout(() => {
        heart.remove();
      }, 4000);
    }

    // Continuously create hearts
    setInterval(createHeart, 500);
  </script>

</body>
</html>
